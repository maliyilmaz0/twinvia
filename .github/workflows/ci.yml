name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-publication.py
      - run: python3 -m unittest discover -s scripts/tests -v

  security-quality:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified security tools
        run: python3 scripts/install-security-tools.py
      - name: Check workflows, Python correctness and full Git history
        run: python3 scripts/check-security.py

  android:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Kotlin formatting
        run: python3 scripts/format-code.py --check --language kotlin
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, lint and test
        run: ./scripts/build-android.sh --console=plain
      - name: Dependency policy regression test
        run: python3 scripts/test-dependency-policy.py
      - name: Build standalone clipboard probe
        run: ./apps/android/gradlew -p tools/clipboard-probe verifyBuildDependencySecurity assembleDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-debug
          retention-days: 7
          path: |
            .artifacts/android/Twinvia-debug.apk
            .artifacts/android/TwinviaClipboardHelper.jar
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/core/protocol/build/reports/tests/
            apps/android/core/protocol/build/test-results/test/

  macos:
    needs: publication
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TWINVIA_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native signing regression
        run: python3 -m unittest discover -s scripts/tests -p test_macos_signing.py -v
      - name: Swift formatting
        run: python3 scripts/format-code.py --check --language swift
      - name: Shared protocol tests
        run: swift test --package-path shared/protocol/swift --enable-code-coverage
      - name: Desktop tests
        run: swift test --package-path apps/macos --enable-code-coverage
      - name: Preserve Swift coverage
        run: |
          mkdir -p .artifacts/coverage
          cp "$(swift test --package-path shared/protocol/swift --show-codecov-path)" .artifacts/coverage/shared-swift.json
          cp "$(swift test --package-path apps/macos --show-codecov-path)" .artifacts/coverage/macos-swift.json
      - name: Build app
        run: ./scripts/build-macos.sh
      - name: Preserve app bundle
        run: |
          codesign --verify --deep --strict .artifacts/macos/Twinvia.app
          ditto -c -k --sequesterRsrc --keepParent .artifacts/macos/Twinvia.app .artifacts/Twinvia-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-debug
          retention-days: 7
          path: .artifacts/Twinvia-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-coverage
          retention-days: 7
          path: .artifacts/coverage/
