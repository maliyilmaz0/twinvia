name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-publication.py
      - run: python3 -m unittest discover -s scripts/tests -v

  android:
    needs: publication
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Kotlin formatting
        run: python3 scripts/format-code.py --check --language kotlin
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, lint and test
        run: ./scripts/build-android.sh --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug
          retention-days: 7
          path: |
            .artifacts/android/Twinvia-debug.apk
            .artifacts/android/TwinviaClipboardHelper.jar
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/core/protocol/build/reports/tests/
            apps/android/core/protocol/build/test-results/test/

  macos:
    needs: publication
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TWINVIA_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift formatting
        run: python3 scripts/format-code.py --check --language swift
      - name: Shared protocol tests
        run: swift test --package-path shared/protocol/swift
      - name: Desktop tests
        run: swift test --package-path apps/macos
      - name: Build app
        run: ./scripts/build-macos.sh
      - name: Preserve app bundle
        run: |
          codesign --verify --deep --strict .artifacts/macos/Twinvia.app
          ditto -c -k --sequesterRsrc --keepParent .artifacts/macos/Twinvia.app .artifacts/Twinvia-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-debug
          retention-days: 7
          path: .artifacts/Twinvia-macos.zip
