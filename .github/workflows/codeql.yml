name: CodeQL security analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Native CodeQL is unavailable on this personal private repository's plan.
    # Public repositories are eligible; private repositories need Code Security.
    if: github.event.repository.private == false || vars.TWINVIA_CODEQL_ENABLED == 'true'
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            runner: ubuntu-24.04
            build-mode: none
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
          - language: java-kotlin
            runner: ubuntu-24.04
            build-mode: manual
          - language: swift
            runner: macos-15-intel
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.language == 'swift' && 90 || 30 }}
    permissions:
      contents: read
      security-events: write
    env:
      TWINVIA_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: matrix.language == 'java-kotlin'
        with:
          packages: platform-tools
      - if: matrix.language == 'java-kotlin'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Select supported Swift toolchain
        if: matrix.language == 'swift'
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Prepare native dependencies before Swift extraction
        if: matrix.language == 'swift'
        run: |
          python3 scripts/prepare-nearby-sdk.py
          # --target builds only that target, so prepare each native dependency.
          # No Swift product target is built until CodeQL initializes below.
          for target in openssl_grpc abseil protobuf-utf8 protobuf ukey2 json smhasher NearbyCommon NearbyCoreAdapter; do
            # Swift extraction uses x86_64. Run on native Intel to avoid Rosetta
            # overhead and keep preparation and traced builds on one architecture.
            xcrun swift build --arch "$(uname -m)" --package-path apps/macos/BluetoothBridge --target "$target" --jobs 6
          done
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
      - if: matrix.language == 'java-kotlin'
        run: ./scripts/build-android.sh --console=plain
      - if: matrix.language == 'swift'
        run: ./scripts/build-macos.sh
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:${{ matrix.language }}'
