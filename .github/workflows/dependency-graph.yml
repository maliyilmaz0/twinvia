name: Submit Android dependency graph
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**/*.gradle.kts'
      - 'apps/android/gradle/**'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dependency-snapshot
  cancel-in-progress: false

jobs:
  dependency-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/dependency-submission@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          build-root-directory: apps/android
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
