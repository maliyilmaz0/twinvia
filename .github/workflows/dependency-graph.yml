name: Submit Android dependency graph
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**/*.gradle.kts'
      - 'apps/android/gradle/**'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dependency-snapshot
  cancel-in-progress: false

jobs:
  dependency-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/dependency-submission@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          build-root-directory: apps/android
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
