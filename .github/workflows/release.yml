name: Publish developer preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and test run ID from a push to main
        required: true
        type: string
      stable:
        description: Publish to the signed in-app stable update channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Verify source CI run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/workflows/ci.yml" > "$RUNNER_TEMP/source-workflow.json"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/source-jobs.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP'])/'source-run.json').read_text())
          workflow = json.loads((Path(os.environ['RUNNER_TEMP'])/'source-workflow.json').read_text())
          jobs = json.loads((Path(os.environ['RUNNER_TEMP'])/'source-jobs.json').read_text())['jobs']
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'CI must pass first'
          assert run['workflow_id'] == workflow['id'], 'Unexpected source workflow'
          assert run['event'] == 'push' and run['head_branch'] == 'main', 'Only main push builds can be released'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected source repository'
          assert all(any(j['name'] == name and j['conclusion'] == 'success' for j in jobs) for name in ['publication', 'security-quality', 'android', 'macos']), 'All required jobs must pass'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate product publication scope
        run: python3 scripts/check-publication.py
      - name: Download tested binaries
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --name macos-debug --dir .artifacts/release-input/macos
          gh run download "$SOURCE_RUN_ID" --name android-debug --dir .artifacts/release-input/android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Verify persistent Android release signature
        env:
          EXPECTED_SIGNER: ${{ vars.TWINVIA_ANDROID_SIGNER_SHA256 }}
        run: |
          sdkmanager 'build-tools;36.0.0'
          python3 - <<'PYSIGN'
          import os, re, subprocess, plistlib
          from pathlib import Path
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          apk = Path('.artifacts/release-input/android/.artifacts/android/Twinvia-debug.apk')
          output = subprocess.check_output([str(signer), 'verify', '--print-certs', str(apk)], text=True)
          actual = [value.lower() for value in re.findall(r'^Signer #[0-9]+ certificate SHA-256 digest: ([a-fA-F0-9]{64})$', output, re.M)]
          expected = os.environ['EXPECTED_SIGNER'].lower()
          assert re.fullmatch('[a-f0-9]{64}', expected) and actual == [expected], 'Release APK must use the persistent distribution identity'
          expected_info = plistlib.loads(Path('apps/macos/Configuration/Info.plist').read_bytes())
          version_code = subprocess.check_output(['apkanalyzer', 'manifest', 'version-code', str(apk)], text=True).strip()
          version_name = subprocess.check_output(['apkanalyzer', 'manifest', 'version-name', str(apk)], text=True).strip()
          assert version_code == expected_info['CFBundleVersion'] and version_name == expected_info['CFBundleShortVersionString'], 'APK version/build mismatch'
          print('Persistent Android release signature and binary version verified.')
          PYSIGN
      - name: Package preview
        id: package
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/package-release.py --inputs .artifacts/release-input --output .artifacts/release-assets --run-id "$SOURCE_RUN_ID" --commit "$SOURCE_SHA" --repository "$GH_REPO")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd .artifacts/release-assets && sha256sum --check SHA256SUMS)
      - name: Sign update assets
        env:
          TWINVIA_UPDATE_PRIVATE_KEY: ${{ secrets.TWINVIA_UPDATE_PRIVATE_KEY }}
          VERSION: ${{ steps.package.outputs.version }}
          STABLE: ${{ inputs.stable }}
        run: python3 scripts/sign-update-release.py --directory .artifacts/release-assets --version "$VERSION"
      - name: Create release draft and upload assets
        env:
          VERSION: ${{ steps.package.outputs.version }}
          STABLE: ${{ inputs.stable }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # Refuse to overwrite any existing tag or release, including a partial draft.
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION" --jq 'length')" = 0
          gh release create "v$VERSION" --target "$SOURCE_SHA" --title "Twinvia $VERSION — Developer Preview" --draft --prerelease --notes-file docs/releasing.md
          gh release upload "v$VERSION" .artifacts/release-assets/*
      - name: Verify remote bytes and publish preview
        env:
          VERSION: ${{ steps.package.outputs.version }}
          STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/release-verification"
          (cd "$RUNNER_TEMP/release-verification" && sha256sum --check SHA256SUMS)
          if [[ "$STABLE" == true ]]; then
            gh release edit "v$VERSION" --draft=false --prerelease=false --latest=true
          else
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false
          fi
