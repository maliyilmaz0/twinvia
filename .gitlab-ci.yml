stages: [verify, build]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

default:
  interruptible: true

publication:
  stage: verify
  image: python:3.12-slim
  timeout: 10m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check-publication.py
    - python3 -m unittest discover -s scripts/tests -v

android:
  stage: build
  image: eclipse-temurin:21-jdk
  timeout: 40m
  variables:
    ANDROID_HOME: '$CI_PROJECT_DIR/.tooling/android-sdk'
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.tooling/gradle'
  cache:
    key:
      files: [apps/android/gradle/libs.versions.toml, apps/android/gradle/wrapper/gradle-wrapper.properties]
      prefix: android-jdk21
    paths: [.tooling/gradle/caches/, .tooling/gradle/wrapper/, .tooling/android-sdk/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 git curl ca-certificates
    - bash scripts/setup-android-ci.sh
  script:
    - python3 scripts/format-code.py --check --language kotlin
    - ./scripts/build-android.sh --console=plain
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .artifacts/android/Twinvia-debug.apk
      - .artifacts/android/TwinviaClipboardHelper.jar
      - apps/android/app/build/reports/tests/
      - apps/android/app/build/reports/lint-results-debug.html
      - apps/android/core/protocol/build/reports/tests/
    reports:
      junit:
        - apps/android/app/build/test-results/testDebugUnitTest/TEST-*.xml
        - apps/android/core/protocol/build/test-results/test/TEST-*.xml

macos:
  stage: build
  tags: [macos]
  timeout: 45m
  variables:
    TWINVIA_SIGNING_IDENTITY: '-'
  script:
    - python3 scripts/format-code.py --check --language swift
    - swift test --package-path shared/protocol/swift
    - swift test --package-path apps/macos
    - ./scripts/build-macos.sh
    - codesign --verify --deep --strict .artifacts/macos/Twinvia.app
    - ditto -c -k --sequesterRsrc --keepParent .artifacts/macos/Twinvia.app .artifacts/Twinvia-macos.zip
  artifacts:
    expire_in: 7 days
    paths: [.artifacts/Twinvia-macos.zip]
